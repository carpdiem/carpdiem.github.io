<head>
	<!-- Global site tag (gtag.js) - Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=UA-169007097-1"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'UA-169007097-1');
</script>

  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FFF7D6">
  <script>
    (() => {
      const root = document.documentElement;
      let temperature = "3400k";
      try {
        if (localStorage.getItem("usuallypragmatic.ember-temperature") === "1200k") {
          temperature = "1200k";
        }
      } catch (_) {
        // Storage can be unavailable in privacy-restricted contexts.
      }
      root.dataset.emberTemperature = temperature;
      root.dataset.emberPalette = temperature === "1200k"
        ? "1200k-dark"
        : (matchMedia("(prefers-color-scheme: dark)").matches ? "3400k-dark" : "3400k-light");
    })();
  </script>
  {%- seo -%}
  <link rel="stylesheet" href="{{ "/assets/ember/ember.css" | relative_url }}">
  <link rel="stylesheet" href="{{ "/assets/css/style.css" | relative_url }}">
  <noscript><style>.ember-js-content { display: none !important; }</style></noscript>
  <script defer src="{{ "/js/ember-site.js" | relative_url }}"></script>
  {%- if jekyll.environment == 'production' and site.google_analytics -%}
    {%- include google-analytics.html -%}
  {%- endif -%}

  <link href="{{ site.url }}/feed.xml" type="application/rss+xml" rel="alternate" title="{{ site.title }}" />
  <link rel="apple-touch-icon" sizes="180x180" href="/images/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon/favicon-16x16.png">
  <link rel="manifest" href="/images/favicon/site.webmanifest">  
  <meta property="og:image" content="{{ "images/favicon/android-chrome-512x512.png" | absolute_url }}" />

{% if page.use_math %}
{% include mathjax_support.html %}
{% endif %}

{% if page.use_jquery %}
{% include jquery_support.html %}
{% endif %}
</head>
